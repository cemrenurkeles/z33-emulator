name: Z33 CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name : Clean
        run : make clean

      - name: Build
        run: make

      - name: Run Z33 test
        run: ./z33 tests/helloworld
      
      - name: Run Z33 test 2
        run: ./z33 tests/factoriel